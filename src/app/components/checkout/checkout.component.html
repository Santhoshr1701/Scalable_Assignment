<div class="checkout-container">
  <h2>Checkout</h2>
  
  <div *ngIf="!paymentSuccess">
    <div class="row">
      <div class="col-md-8">
        <form (ngSubmit)="onSubmit()" class="checkout-form">
          <h4 class="mb-4">Shipping Information</h4>
          
          <div class="form-group">
            <label for="name">Full Name</label>
            <input 
              type="text" 
              id="name" 
              required 
              [(ngModel)]="checkoutData.name" 
              name="name"
              class="form-control"
              placeholder="John Doe"
            >
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input 
              type="email" 
              id="email" 
              required 
              [(ngModel)]="checkoutData.email" 
              name="email"
              class="form-control"
              placeholder="john@example.com"
            >
          </div>

          <div class="form-group">
            <label for="address">Street Address</label>
            <input 
              type="text" 
              id="address" 
              required 
              [(ngModel)]="checkoutData.address" 
              name="address"
              class="form-control"
              placeholder="123 Main Street"
            >
          </div>

          <button type="submit" class="btn btn-success btn-lg w-100 mt-4">
            Complete Order
          </button>
        </form>
      </div>

      <div class="col-md-4">
        <div class="order-summary">
          <h4>Order Summary</h4>
          <div class="summary-item">
            <span>Subtotal:</span>
            <span>{{ totalAmount | priceFormat }}</span>
          </div>
          <div class="summary-item">
            <span>Shipping:</span>
            <span>Free</span>
          </div>
          <div class="summary-item">
            <span>Tax (10%):</span>
            <span>{{ (totalAmount * 0.1) | priceFormat }}</span>
          </div>
          <div class="summary-item total">
            <span>Total:</span>
            <span>{{ (totalAmount * 1.1) | priceFormat }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="paymentSuccess" class="success-message">
    <div class="text-center">
      <h3>✓ Payment Successful!</h3>
      <p>Thank you for your order. We'll process it shortly.</p>
      <a routerLink="/" class="btn btn-primary mt-3">Continue Shopping</a>
    </div>
  </div>
</div>

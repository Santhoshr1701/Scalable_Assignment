<div class="auth-container">
  <h2>Login to Your Account</h2>
  
  <div *ngIf="loginError" class="alert alert-danger" role="alert">
    {{ loginError }}
  </div>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input 
        type="email" 
        id="email" 
        required 
        [(ngModel)]="email" 
        name="email" 
        class="form-control"
        placeholder="Enter your email"
      />
      <div *ngIf="submitted && !email" class="error">
        Email is required.
      </div>
    </div>
    
    <div class="form-group">
      <label for="password">Password</label>
      <input 
        type="password" 
        id="password" 
        required 
        [(ngModel)]="password" 
        name="password" 
        class="form-control"
        placeholder="Enter your password"
      />
      <div *ngIf="submitted && !password" class="error">
        Password is required.
      </div>
    </div>

    <div class="mt-4">
      <p style="text-align: center; color: #666; font-size: 0.9rem;">
        Demo Credentials: <strong>user@example.com</strong> / <strong>password</strong>
      </p>
    </div>
    
    <button type="submit" class="btn btn-primary btn-lg w-100">
      Sign In
    </button>
  </form>

  <div style="text-align: center; margin-top: 20px;">
    <p>Don't have an account? <a routerLink="/signup">Sign up here</a></p>
  </div>
</div>

<div class="auth-container">
  <h2>Create Your Account</h2>
  
  <div *ngIf="signupError" class="alert alert-danger" role="alert">
    {{ signupError }}
  </div>

  <div *ngIf="signupSuccess" class="alert alert-success" role="alert">
    {{ signupSuccess }}
  </div>

  <form (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="firstName">First Name</label>
        <input 
          type="text" 
          id="firstName" 
          required 
          [(ngModel)]="firstName" 
          name="firstName" 
          class="form-control"
          placeholder="John"
        />
        <div *ngIf="submitted && !firstName" class="error">
          First name is required.
        </div>
      </div>

      <div class="form-group col-md-6">
        <label for="lastName">Last Name</label>
        <input 
          type="text" 
          id="lastName" 
          required 
          [(ngModel)]="lastName" 
          name="lastName" 
          class="form-control"
          placeholder="Doe"
        />
        <div *ngIf="submitted && !lastName" class="error">
          Last name is required.
        </div>
      </div>
    </div>
    
    <div class="form-group">
      <label for="email">Email Address</label>
      <input 
        type="email" 
        id="email" 
        required 
        [(ngModel)]="email" 
        name="email" 
        class="form-control"
        placeholder="john@example.com"
      />
      <div *ngIf="submitted && !email" class="error">
        Email is required.
      </div>
    </div>
    
    <div class="form-group">
      <label for="password">Password</label>
      <input 
        type="password" 
        id="password" 
        required 
        [(ngModel)]="password" 
        name="password" 
        class="form-control"
        placeholder="Enter a strong password"
      />
      <small class="form-text text-muted">Minimum 6 characters</small>
      <div *ngIf="submitted && !password" class="error">
        Password is required.
      </div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input 
        type="password" 
        id="confirmPassword" 
        required 
        [(ngModel)]="confirmPassword" 
        name="confirmPassword" 
        class="form-control"
        placeholder="Re-enter your password"
      />
      <div *ngIf="submitted && !confirmPassword" class="error">
        Password confirmation is required.
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-lg w-100">
      Create Account
    </button>
  </form>

  <div style="text-align: center; margin-top: 20px;">
    <p>Already have an account? <a routerLink="/login">Login here</a></p>
  </div>
</div>
